[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none" # required by IMD repository imports
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./out-preview" }]

[fmt]
line_length = 110

[lint]
lint_on_build = false

[invariant]
runs = 64
depth = 120
fail_on_revert = true

[profile.stress.invariant]
runs = 512
depth = 300
fail_on_revert = true
